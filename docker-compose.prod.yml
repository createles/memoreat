version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: memoreat-app:latest
    container_name: memoreat-app-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
    depends_on:
      - db
    networks:
      - memoreat-network
    restart: always

  db:
    image: postgres:15-alpine
    container_name: memoreat-db-prod
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - memoreat-network
    restart: always

volumes:
  postgres-data:

networks:
  memoreat-network:
    driver: bridge
